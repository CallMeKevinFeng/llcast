<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>llcast MJPEG 预览</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #111; color: #eee; font: 14px/1.5 system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  img { width: 100%; background: #000; border-radius: 8px; }
  .bar { display: flex; gap: 16px; align-items: center; margin-top: 12px; }
  #clock { font: 600 22px/1 ui-monospace, monospace; color: #7cf; }
  .hint { color: #888; font-size: 12px; }
</style>
</head>
<body>
<main>
  <img id="cam" src="http://127.0.0.1:8090/" alt="camera">
  <div class="bar"><span id="clock">--:--:--.---</span></div>
  <p class="hint">MJPEG 直出预览（兼容性优先，无转码）。断开后会自动重连；用于快速确认画面与采集链路。</p>
</main>
<script>
const cam = document.getElementById('cam');
const clock = document.getElementById('clock');
function nowText() {
  const d = new Date();
  return d.toLocaleTimeString('zh-CN', { hour12: false }) + '.' +
    String(d.getMilliseconds()).padStart(3, '0');
}
setInterval(() => { clock.textContent = nowText(); }, 10);
cam.onerror = () => setTimeout(() => {
  cam.src = 'http://127.0.0.1:8090/?t=' + Date.now();
}, 1000);
</script>
</body>
</html>
