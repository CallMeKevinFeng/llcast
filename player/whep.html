<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>llcast WHEP</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #111; color: #eee; font: 14px/1.5 system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  video { width: 100%; background: #000; border-radius: 8px; }
  .bar { display: flex; gap: 16px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  #clock { font: 600 22px/1 ui-monospace, monospace; color: #7cf; }
  #stats { color: #8a8; font: 12px/1.4 ui-monospace, monospace; }
  button { padding: 8px 20px; border-radius: 6px; border: 0; background: #2a7; color: #fff; font-size: 15px; cursor: pointer; }
  button:disabled { opacity: .5; }
</style>
</head>
<body>
<main>
  <video id="video" autoplay muted playsinline></video>
  <div class="bar">
    <span id="clock">--:--:--.---</span>
    <button id="connect">连接</button>
    <span id="stats"></span>
  </div>
</main>
<script>
const video = document.getElementById('video');
const clock = document.getElementById('clock');
const stats = document.getElementById('stats');
const btn = document.getElementById('connect');
let pc = null;

function nowText() {
  const d = new Date();
  return d.toLocaleTimeString('zh-CN', { hour12: false }) + '.' +
    String(d.getMilliseconds()).padStart(3, '0');
}
setInterval(() => { clock.textContent = nowText(); }, 10);

function waitIce(peer) {
  if (peer.iceGatheringState === 'complete') return Promise.resolve();
  return new Promise((resolve) => {
    const done = () => {
      if (peer.iceGatheringState === 'complete') resolve();
    };
    peer.addEventListener('icegatheringstatechange', done);
    setTimeout(resolve, 1500);
  });
}

async function connect() {
  btn.disabled = true;
  stats.textContent = 'connecting...';
  if (pc) pc.close();
  pc = new RTCPeerConnection({ iceServers: [] });
  pc.ontrack = (ev) => {
    video.srcObject = ev.streams[0] || new MediaStream([ev.track]);
  };
  pc.onconnectionstatechange = () => {
    stats.textContent = 'peer: ' + pc.connectionState;
  };
  pc.addTransceiver('video', { direction: 'recvonly' });

  try {
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await waitIce(pc);
    const res = await fetch('/whep', {
      method: 'POST',
      headers: { 'Content-Type': 'application/sdp' },
      body: pc.localDescription.sdp
    });
    if (!res.ok) throw new Error(await res.text());
    const answer = await res.text();
    await pc.setRemoteDescription({ type: 'answer', sdp: answer });
  } catch (e) {
    stats.textContent = 'error: ' + e.message;
    btn.disabled = false;
    return;
  }

  setInterval(async () => {
    if (!pc) return;
    const report = await pc.getStats();
    report.forEach((s) => {
      if (s.type === 'inbound-rtp' && s.kind === 'video') {
        stats.textContent =
          `fps ${s.framesPerSecond || 0} | decoded ${s.framesDecoded || 0} | ` +
          `lost ${s.packetsLost || 0} | jitter ${((s.jitter || 0) * 1000).toFixed(1)} ms`;
      }
    });
  }, 1000);
}
btn.addEventListener('click', connect);
</script>
</body>
</html>
